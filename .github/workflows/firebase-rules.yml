name: Firebase rules

on:
  push:
    branches: [main, 'codex/**']
    paths: ['firebase/**', '.github/workflows/firebase-rules.yml']
  pull_request:
    paths: ['firebase/**', '.github/workflows/firebase-rules.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase/rules-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Test RTDB rules in isolated emulator
        run: npm run test:emulator
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firebase-emulator-logs
          path: firebase/rules-tests/*debug.log
          if-no-files-found: ignore
